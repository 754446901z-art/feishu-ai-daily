name: Daily AI Strategies to Feishu

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集并预览，不发送飞书消息、不保存远程状态"
        type: boolean
        required: true
        default: true
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 定时任务可能排队延迟。
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: feishu-ai-daily
  cancel-in-progress: false

jobs:
  send:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check syntax and run offline tests
        run: |
          python -m compileall -q discover.py source_utils.py send.py persist.py review.py tests
          python -m unittest discover -s tests -v

      - name: Discover public practice candidates
        id: discover
        continue-on-error: true
        run: python discover.py

      - name: Preview without sending
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python send.py --dry-run

      - name: Prepare daily batch without sending
        id: prepare
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: python send.py --prepare

      - name: Persist candidates and prepared batch before sending
        id: checkpoint
        if: steps.prepare.outcome == 'success'
        run: python persist.py

      - name: Send prepared batch to Feishu
        if: steps.checkpoint.outcome == 'success'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          REQUIRE_DURABLE_STATE: "1"
        run: python send.py --deliver

      - name: Persist delivery result even after delivery failure
        if: always() && steps.checkpoint.outcome == 'success'
        run: python persist.py
