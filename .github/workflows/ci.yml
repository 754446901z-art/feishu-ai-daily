name: Offline tests

on:
  push:
    paths:
      - "**.py"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check syntax and run offline tests
        run: |
          python -m compileall -q discover.py source_utils.py send.py persist.py review.py tests
          python -m unittest discover -s tests -v
